# Ambiente de DESENVOLVIMENTO e TESTES do backend. Não é para deploy: o app
# completo (backend + frontend) sobe pelo repositório principal
# https://github.com/nunesvictor/ishinydex, que usa o Dockerfile daqui.
#
#   cp .env.example src/.env && ln -s src/.env .env   # e troque os change-me
#   docker compose up -d --build      # runserver em http://localhost:8008
#   docker compose exec web python manage.py compilemessages -l pt_BR  # 1ª vez
#   docker compose run --rm web python manage.py test
#
# Cada cópia do repositório (clone ou worktree) vira um projeto compose
# próprio, com banco e volumes isolados.

volumes:
  data:
  sprites:

services:
  # One-shot: popula o volume `sprites` (só reescreve quando a versão muda).
  # O download da PokeAPI acontece apenas no build desta imagem; depois disso
  # tudo roda offline a partir do volume local.
  sprites:
    build:
      context: .
      target: sprites-data
    image: ${APP_NAME:-ishinydex}-sprites:${APP_VERSION:-latest}
    restart: "no"
    volumes:
      - sprites:/data

  db:
    # Fixo em 17: precisa bater com o pg_dump/pg_restore da imagem (Debian trixie
    # → postgresql-client 17). Sem porta publicada: só o `web` acessa, pela rede
    # interna do compose.
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ishinydex}
    restart: unless-stopped
    volumes:
      - data:/var/lib/postgresql/data
      - ./backups:/var/lib/postgresql/backups

  web:
    build:
      context: .
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    depends_on:
      db:
        condition: service_started
      sprites:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@localhost}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
    image: ${APP_NAME:-ishinydex}:${APP_VERSION:-latest}
    # 8008: a porta padrão do `API_BASE_URL` do frontend em desenvolvimento.
    ports:
      - "${X_WEB_PORT:-8008}:8000"
    restart: unless-stopped
    volumes:
      - .:/home/guest/ishinydex
      - sprites:/home/guest/ishinydex/src/media/sprites:ro
