volumes:
  data:

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ishinydex}
    volumes:
      - data:/var/lib/postgresql/data
      - ./backups:/var/lib/postgresql/backups

  app:
    build:
      context: .
      args:
        - POETRY_ARGS=--with prod
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@localhost}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
      RECREATE_DB: ${RECREATE_DB:-0}
    ports:
      - "8000:8000"
    volumes:
      - .:${APP_HOME}
      - .cache/pokebase:/home/guest/.cache/pokebase

  jupyter:
    build:
      context: .
      args:
        - POETRY_ARGS=--with dev
    command: jupyter lab --ip=0.0.0.0 --notebook-dir=notebooks --port=8088 --no-browser --allow-root
    env_file:
      - .env
    ports:
      - "8088:8088"
    volumes:
      - .:${APP_HOME}
      - .cache/pokebase:/home/guest/.cache/pokebase

