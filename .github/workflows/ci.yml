name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  POETRY_VERSION: 2.4.1

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      # GitGuardian suspenso como check obrigatório (tool/gitguardian.py do
      # repositório principal): um aviso em cada execução, até o `resume`.
      - name: Aviso do GitGuardian
        if: vars.GITGUARDIAN != '' && vars.GITGUARDIAN != 'ativo'
        env:
          STATE: ${{ vars.GITGUARDIAN }}
        run: echo "::warning title=GitGuardian suspenso::$STATE. Para reativar, tool/gitguardian.py resume (repositório ishinydex)."

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Testes (Postgres 17)
    runs-on: ubuntu-latest
    services:
      # Mesma versão do serviço `db` dos composes (dev daqui e o do repositório principal).
      postgres:
        image: postgres:17-alpine
        env:
          # Banco descartável, só acessível pelo job: sem senha no arquivo.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      # O poetry.toml desliga o virtualenv (o Docker instala no sistema); no CI
      # um virtualenv próprio permite cachear as dependências.
      POETRY_VIRTUALENVS_CREATE: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - uses: actions/checkout@v5

      # O settings.py exige SECRET_KEY e POSTGRES_PASSWORD. Valores aleatórios
      # a cada execução (com `trust`, o Postgres aceita qualquer senha), para
      # não versionar nada com cara de segredo.
      - name: Gerar credenciais de teste
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      # compilemessages precisa do gettext; os testes conferem textos em pt-BR.
      - run: sudo apt-get update -q && sudo apt-get install -y -q gettext

      - run: poetry install --no-root --only main

      - name: Compilar traduções
        working-directory: src
        run: poetry run python manage.py compilemessages -l pt_BR

      - name: Testes
        working-directory: src
        # Um processo por núcleo, cada um com o seu clone do banco de teste.
        run: poetry run python manage.py test --parallel auto

  # Os mesmos testes pela imagem do Dockerfile e pelo docker compose, como o
  # teste local antes do merge (CLAUDE.md do repositório principal): pega o
  # que só quebra na imagem (dependências instaladas no sistema, locale,
  # entrypoint). O serviço `sprites` fica de fora (--no-deps): ele baixa os
  # sprites da PokeAPI, que os testes não usam.
  docker:
    name: Testes (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # O .env do compose a partir do exemplo, com valores aleatórios no
      # lugar dos change-me.
      - name: Gerar o .env
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" \
              -e "s/^DJANGO_SUPERUSER_PASSWORD=.*/DJANGO_SUPERUSER_PASSWORD=$(openssl rand -hex 16)/" \
              .env.example > src/.env
          ln -s src/.env .env

      # O código entra por volume e o container roda como o usuário 1000
      # (guest); no runner o checkout é de outro usuário, e o compilemessages
      # precisa escrever em src/.
      - run: chmod -R a+rwX src

      - run: docker compose build web

      - name: Subir o banco
        run: |
          docker compose up -d db
          for _ in $(seq 30); do
            docker compose exec -T db pg_isready -q && exit 0
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Testes
        run: >-
          docker compose run --rm --no-deps -T web sh -c
          "python manage.py compilemessages -l pt_BR && python manage.py test"
