# Gera o pacote do catálogo (ishinydex#48, etapa 1) e o publica como release
# `catalog-AAAA.MM.DD`, com o catalog.json e o arquivo dos golpes
# (moves-AAAA.MM.DD.json, #134) anexados.
#
# Os dados vêm do PokeAPI/api-data (o JSON estático da PokéAPI), lido do disco
# pelo sync_pokeapi: sem instância local da PokéAPI e sem a API pública. Os
# itens seguráveis de cada jogo (#138) vêm do Pokémon Showdown, num commit
# fixo (SHOWDOWN_COMMIT), lidos como texto pelo sync_held_items.
# Rodar quando sair jogo novo ou mudar o importador, o exportcatalog ou os
# dados versionados em src/pokedex/data/ (shiny locks, exclusivos de versão,
# encontros especiais).
name: Catálogo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (vazio = catalog-AAAA.MM.DD de hoje)"
        required: false

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"
  # smogon/pokemon-showdown (MIT): trocar o commit e rodar de novo para
  # pegar itens novos.
  SHOWDOWN_COMMIT: 5b01be81011ec12efa25dcfff49ea279a6029d6f
  POETRY_VERSION: 2.4.1

jobs:
  catalog:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # O migrate usa o banco de verdade (os testes criam o seu próprio).
          POSTGRES_DB: ishinydex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POETRY_VIRTUALENVS_CREATE: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
      POKEAPI_URL: file://${{ github.workspace }}/api-data/data
    steps:
      - uses: actions/checkout@v5

      - name: Versão
        run: |
          version="${{ inputs.version }}"
          echo "CATALOG_VERSION=${version:-catalog-$(date -u +%Y.%m.%d)}" >> "$GITHUB_ENV"

      # Como no CI de testes: credenciais aleatórias, nada versionado.
      - name: Gerar credenciais
        run: |
          echo "SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # Só os endpoints que o importador lê (o repositório inteiro tem ~300 MB).
      - name: Baixar o api-data
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/PokeAPI/api-data.git api-data
          git -C api-data sparse-checkout set \
            data/api/v2/pokemon-species data/api/v2/pokemon \
            data/api/v2/pokemon-form data/api/v2/version data/api/v2/version-group \
            data/api/v2/evolution-chain data/api/v2/item data/api/v2/move \
            data/api/v2/location data/api/v2/machine
          echo "API_DATA_COMMIT=$(git -C api-data rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Só os itens: data/items.ts e, de cada mod, items.ts e scripts.ts.
      - name: Baixar os itens do Showdown
        run: |
          git init -q showdown
          git -C showdown remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C showdown sparse-checkout set --no-cone \
            /data/items.ts '/data/mods/*/items.ts' '/data/mods/*/scripts.ts'
          git -C showdown fetch -q --depth 1 --filter=blob:none origin "$SHOWDOWN_COMMIT"
          git -C showdown checkout -q FETCH_HEAD

      - run: pipx install "poetry==${POETRY_VERSION}"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      # Os rótulos das escolhas saem em pt-BR.
      - run: sudo apt-get update -q && sudo apt-get install -y -q gettext

      - run: poetry install --no-root --only main

      - name: Gerar o catálogo
        working-directory: src
        run: |
          poetry run python manage.py compilemessages -l pt_BR
          poetry run python manage.py migrate --noinput
          poetry run python manage.py sync_pokeapi
          poetry run python manage.py sync_held_items ../showdown
          poetry run python manage.py exportcatalog \
            --output ../catalog --catalog-version "$CATALOG_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CATALOG_VERSION }}
          path: catalog/*.json

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$CATALOG_VERSION" catalog/*.json \
            --target "$GITHUB_SHA" \
            --title "$CATALOG_VERSION" \
            --notes "Pacote do catálogo gerado do PokeAPI/api-data@${API_DATA_COMMIT} e dos itens do smogon/pokemon-showdown@${SHOWDOWN_COMMIT::7} pelo commit ${GITHUB_SHA::7}. Formato em src/catalog/build.py."
