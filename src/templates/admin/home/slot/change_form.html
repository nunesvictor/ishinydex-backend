{% extends "admin/change_form.html" %}
{% load sprites %}
{% block form_top %}
  {{ block.super }}
  {% if original %}
    <div class="custom-help-banner-container">
      <img src="{% get_sprite_url original %}"
           alt="{{ original }}"
           class="custom-help-banner-img {% if not original.specimen %}status-unregistred{% endif %}"
           height="192"
           width="192" />
    </div>
  {% endif %}
{% endblock form_top %}
