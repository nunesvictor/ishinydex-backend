# Hooks de formatação e lint rodados a cada `git commit`.
#   pre-commit install            # uma vez por clone
#   pre-commit run --all-files    # roda em todo o projeto
# Cada ferramenta lê a própria config (pyproject.toml / .flake8). Mantenha as
# versões (rev) alinhadas com o grupo `dev` do pyproject.toml.

# Migrations são geradas pelo Django; as configs já as excluem, mas os hooks
# recebem os arquivos explicitamente e ignorariam o exclude do black.
exclude: /migrations/

repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  # Checagem de tipos com o motor do Pylance (config em [tool.pyright] do
  # pyproject.toml). Roda no projeto todo, não só nos arquivos do commit: um
  # erro de tipo aparece no arquivo que *usa* o que mudou. O ambiente do hook
  # é isolado, então leva as libs e os stubs que o código importa (versões do
  # poetry.lock).
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        pass_filenames: false
        additional_dependencies:
          - django==6.0.3
          - django-cors-headers==4.9.0
          - django-debug-toolbar==7.0.0
          - django-stubs==6.1.1
          - djangorestframework==3.17.1
          - djangorestframework-stubs==3.18.1
          - drf-spectacular==0.30.0
          - psycopg2-binary==2.9.12
          - python-decouple==3.8
          - requests==2.34.2
